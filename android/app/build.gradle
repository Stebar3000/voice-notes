plugins {
    id 'com.android.application'
}

android {
    namespace 'it.stebar.noteauto'
    compileSdk 34

    defaultConfig {
        applicationId "it.stebar.noteauto"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-prova"
    }

    // Chiave di firma fissa nel repository: ogni nuova versione si installa sopra la precedente.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
